<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Phone Blades: your phone is the blade">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>
    <clipPath id="frame"><rect width="1280" height="400" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="#000"/>

    <!-- floor grid running toward the horizon -->
    <g stroke="#1f2340" stroke-width="1.5" fill="none">
      <path d="M960 250 L640 400 M960 250 L800 400 M960 250 L960 400 M960 250 L1120 400 M960 250 L1280 400 M960 250 L1280 330 M960 250 L480 400"/>
      <path d="M700 372 H1280 M790 330 H1280 M850 302 H1280 M893 282 H1280 M922 268 H1280 M942 259 H1280"/>
    </g>
    <!-- lane rails in the blade colours -->
    <path d="M960 250 L760 400" stroke="#ff7a1a" stroke-width="2" opacity="0.7"/>
    <path d="M960 250 L1160 400" stroke="#19e6ff" stroke-width="2" opacity="0.7"/>

    <!-- tunnel frames -->
    <g stroke="#5b47d6" fill="none" opacity="0.55">
      <rect x="820" y="120" width="280" height="190" stroke-width="2"/>
      <rect x="880" y="160" width="160" height="110" stroke-width="1.5" opacity="0.7"/>
      <rect x="918" y="190" width="84" height="60" stroke-width="1" opacity="0.5"/>
    </g>

    <!-- incoming blocks -->
    <g>
      <rect x="868" y="226" width="44" height="44" rx="6" fill="#ff7a1a" opacity="0.9"/>
      <path d="M890 255 l-10 -12 h20 z" fill="#fff"/>
      <rect x="1006" y="214" width="56" height="56" rx="8" fill="#19e6ff" opacity="0.9"/>
      <path d="M1034 228 l12 14 h-24 z" fill="#fff"/>
      <rect x="944" y="200" width="30" height="30" rx="4" fill="#19e6ff" opacity="0.6"/>
    </g>

    <!-- crossed blades -->
    <g filter="url(#glow)" stroke-linecap="round">
      <path d="M760 360 L1110 70" stroke="#ff7a1a" stroke-width="12"/>
      <path d="M1180 360 L830 70" stroke="#19e6ff" stroke-width="12"/>
    </g>
    <g stroke-linecap="round">
      <path d="M760 360 L1110 70" stroke="#fff4ea" stroke-width="4"/>
      <path d="M1180 360 L830 70" stroke="#eafcff" stroke-width="4"/>
      <path d="M738 378 L770 352" stroke="#3a3d4a" stroke-width="14"/>
      <path d="M1202 378 L1170 352" stroke="#3a3d4a" stroke-width="14"/>
    </g>
    <!-- sparks at the cross -->
    <g fill="#fff" filter="url(#soft)">
      <circle cx="970" cy="186" r="5"/><circle cx="992" cy="170" r="2.5"/><circle cx="948" cy="168" r="2.5"/><circle cx="984" cy="206" r="2"/>
    </g>

    <!-- copy -->
    <g font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#fff">
      <text x="80" y="150" font-size="72" font-weight="700" letter-spacing="-1.5">Phone Blades</text>
      <text x="82" y="204" font-size="28" fill="#a3a3a3">Your phone is the blade.</text>
      <text x="82" y="240" font-size="28" fill="#a3a3a3">Slice every block on the beat.</text>
      <g font-size="18" font-weight="600">
        <rect x="80" y="282" width="150" height="40" rx="10" fill="#181818" stroke="#313131"/>
        <text x="155" y="308" text-anchor="middle" fill="#ff7a1a">Left blade</text>
        <rect x="244" y="282" width="160" height="40" rx="10" fill="#181818" stroke="#313131"/>
        <text x="324" y="308" text-anchor="middle" fill="#19e6ff">Right blade</text>
        <rect x="418" y="282" width="186" height="40" rx="10" fill="#181818" stroke="#313131"/>
        <text x="511" y="308" text-anchor="middle" fill="#e5e5e5">Any network</text>
      </g>
    </g>
  </g>
</svg>
